<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-pwshx plugin icon.
    Theme: the PowerShell prompt glyph >_ on a deep PowerShell-blue tile,
    with a small amber impact spark for the "elbow-proof" idea.
    Canvas: 36x36 (the DSH plugin icon convention).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2A5B"/>
      <stop offset="1" stop-color="#012456"/>
    </linearGradient>
    <linearGradient id="fg" x1="8" y1="10" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86B8F5"/>
      <stop offset="1" stop-color="#5391FE"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="8" fill="url(#bg)"/>
  <!-- > chevron -->
  <path d="M9 11 L17 18 L9 25" stroke="url(#fg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- _ underscore -->
  <path d="M20 25 H28" stroke="url(#fg)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- amber impact spark (top-right) -->
  <path d="M27 8.5 L29.5 11 M29.5 8.5 L27 11" stroke="#FFB86C" stroke-width="1.6" stroke-linecap="round"/>
</svg>